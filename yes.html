<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffdeeb" />
    <title>Тағы бір сұрақ 💗</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="floaties" aria-hidden="true"><span>♡</span><span>✿</span><span>♡</span><span>✦</span><span>♡</span><span>✿</span></div>
    <main class="stage">
      <section class="card flow-card" aria-labelledby="confirm-title">
        <div class="tape" aria-hidden="true"></div>
        <p class="eyebrow">ТАҒЫ БІР КІШКЕНТАЙ СҰРАҚ</p>
        <div class="mini-heart" aria-hidden="true">♥</div>
        <h1 id="confirm-title">Сіз мені<br /><em>точно-точно</em><br />кешіресіз бе?</h1>
        <p class="message">Шынымен бе? Соңғы рет сұрап тұрмын… 🥺</p>
        <div class="swap-zone" id="swapZone">
          <a class="btn btn-yes swap-choice yes-choice" href="rating.html">Иә, точно ♡</a>
          <button class="btn btn-no swap-choice no-choice" id="swapNo" type="button">Жоқ</button>
        </div>
        <p class="hint" id="swapHint" aria-live="polite">Жауабыңызды жақсылап ойланыңыз…</p>
      </section>
    </main>
    <script src="paper.js"></script><script src="yes.js"></script>
  </body>
</html>
